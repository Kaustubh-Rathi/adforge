services:
  postgres:
    image: postgres:16-alpine
    container_name: adforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-adforge}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: adforge-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official Google Ads MCP server (read-only KPI path).
  # Source: https://github.com/googleads/google-ads-mcp
  # Launched via pipx to avoid vendoring; runs over stdio but we expose it as
  # streamable_http on port 9006 so the KPI agent can talk to it remotely.
  mcp-google-ads-official:
    image: ghcr.io/googleads/google-ads-mcp:latest
    container_name: adforge-mcp-google-ads-official
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable_http
      MCP_PORT: 9006
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/gcp.json
    ports: ["9006:9006"]
    volumes:
      - ./creds:/creds:ro
    # If no creds available, fall through to mock mode inside our wrapper.

  # Distributed MCP servers — one process per agent domain.
  # Each runs independently so no single instance carries the full load.
  # NOTE: Meta / TikTok / Snap / Reddit are reached via Pipeboard's hosted remote
  # MCP (free tier). See docs/RESEARCH.md. No local container needed for them.
  mcp-research:
    build: .
    container_name: adforge-mcp-research
    command: ["python", "-m", "adforge.mcp_servers.runner", "research"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_RESEARCH_PORT:-9001}
    ports: ["9001:9001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  mcp-ads:
    build: .
    container_name: adforge-mcp-ads
    command: ["python", "-m", "adforge.mcp_servers.runner", "ads"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_ADS_PORT:-9002}
    ports: ["9002:9002"]

  mcp-analytics:
    build: .
    container_name: adforge-mcp-analytics
    command: ["python", "-m", "adforge.mcp_servers.runner", "analytics"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_ANALYTICS_PORT:-9003}
    ports: ["9003:9003"]
    depends_on:
      postgres: { condition: service_healthy }

  mcp-roi:
    build: .
    container_name: adforge-mcp-roi
    command: ["python", "-m", "adforge.mcp_servers.runner", "roi"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_ROI_PORT:-9004}
    ports: ["9004:9004"]

  mcp-compliance:
    build: .
    container_name: adforge-mcp-compliance
    command: ["python", "-m", "adforge.mcp_servers.runner", "compliance"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_COMPLIANCE_PORT:-9005}
    ports: ["9005:9005"]

  # v0.2: Public data MCP server — SimilarWeb + AppStore + IPInfo + AbuseIPDB.
  # All tools are read-only. Gives the Research agent real public data without
  # needing paid ad-platform credentials. See docs/RESEARCH.md.
  mcp-public-data:
    build: .
    container_name: adforge-mcp-public-data
    command: ["python", "-m", "adforge.mcp_servers.runner", "public_data"]
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: ${MCP_PUBLIC_DATA_PORT:-9007}
    ports: ["9007:9007"]

  # FastAPI orchestration layer
  api:
    build: .
    container_name: adforge-api
    command: ["uvicorn", "adforge.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-research: { condition: service_started }
      mcp-ads: { condition: service_started }
      mcp-analytics: { condition: service_started }
      mcp-roi: { condition: service_started }
      mcp-compliance: { condition: service_started }
    volumes:
      - ./adforge:/app/adforge:ro

  # Streamlit dashboard
  dashboard:
    build: .
    container_name: adforge-dashboard
    command: ["streamlit", "run", "adforge/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: .env
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_started }
    volumes:
      - ./adforge:/app/adforge:ro

volumes:
  pgdata:
  redisdata:
