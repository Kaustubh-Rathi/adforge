x-app-env: &app-env
  POSTGRES_HOST: postgres
  REDIS_HOST: redis
  # Containers must listen on all interfaces; host port publishing is still
  # restricted to 127.0.0.1 below.
  MCP_BIND_HOST: 0.0.0.0

services:
  postgres:
    image: postgres:16-alpine
    container_name: adforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-adforge}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: adforge-redis
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official Google Ads MCP server (read-only KPI path).
  # Source: https://github.com/googleads/google-ads-mcp
  # Requires Google Cloud ADC mounted at /creds/gcp.json.
  mcp-google-ads-official:
    image: ghcr.io/googleads/google-ads-mcp:latest
    container_name: adforge-mcp-google-ads-official
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable_http
      MCP_PORT: 9006
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /creds/gcp.json
    ports: ["127.0.0.1:9006:9006"]
    volumes:
      - ./creds:/creds:ro

  # Distributed MCP servers — one process per agent domain.
  # Meta / TikTok / Snap / Reddit are reached via Pipeboard's hosted remote
  # MCP when PIPEBOARD_API_TOKEN is configured.
  mcp-research:
    build: .
    container_name: adforge-mcp-research
    command: ["python", "-m", "adforge.mcp_servers.runner", "research"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_RESEARCH_PORT: ${MCP_RESEARCH_PORT:-9001}
    ports: ["127.0.0.1:9001:9001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  mcp-ads:
    build: .
    container_name: adforge-mcp-ads
    command: ["python", "-m", "adforge.mcp_servers.runner", "ads"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_ADS_PORT: ${MCP_ADS_PORT:-9002}
    ports: ["127.0.0.1:9002:9002"]

  mcp-analytics:
    build: .
    container_name: adforge-mcp-analytics
    command: ["python", "-m", "adforge.mcp_servers.runner", "analytics"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_ANALYTICS_PORT: ${MCP_ANALYTICS_PORT:-9003}
    ports: ["127.0.0.1:9003:9003"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  mcp-roi:
    build: .
    container_name: adforge-mcp-roi
    command: ["python", "-m", "adforge.mcp_servers.runner", "roi"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_ROI_PORT: ${MCP_ROI_PORT:-9004}
    ports: ["127.0.0.1:9004:9004"]

  mcp-compliance:
    build: .
    container_name: adforge-mcp-compliance
    command: ["python", "-m", "adforge.mcp_servers.runner", "compliance"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_COMPLIANCE_PORT: ${MCP_COMPLIANCE_PORT:-9005}
    ports: ["127.0.0.1:9005:9005"]

  mcp-public-data:
    build: .
    container_name: adforge-mcp-public-data
    command: ["python", "-m", "adforge.mcp_servers.runner", "public_data"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_PUBLIC_DATA_PORT: ${MCP_PUBLIC_DATA_PORT:-9007}
    ports: ["127.0.0.1:9007:9007"]

  mcp-linkedin:
    build: .
    container_name: adforge-mcp-linkedin
    command: ["python", "-m", "adforge.mcp_servers.runner", "linkedin"]
    env_file: .env
    environment:
      <<: *app-env
      MCP_TRANSPORT: sse
      MCP_LINKEDIN_PORT: ${MCP_LINKEDIN_PORT:-9012}
    ports: ["127.0.0.1:9012:9012"]

  # FastAPI orchestration layer
  api:
    build: .
    container_name: adforge-api
    command: ["uvicorn", "adforge.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      <<: *app-env
      CHECKPOINTER_BACKEND: postgres
      MCP_TRANSPORT: sse
      MCP_RESEARCH_URL: http://mcp-research:9001/sse
      MCP_ADS_URL: http://mcp-ads:9002/sse
      MCP_ANALYTICS_URL: http://mcp-analytics:9003/sse
      MCP_ROI_URL: http://mcp-roi:9004/sse
      MCP_COMPLIANCE_URL: http://mcp-compliance:9005/sse
      MCP_PUBLIC_DATA_URL: http://mcp-public-data:9007/sse
      MCP_LINKEDIN_URL: http://mcp-linkedin:9012/sse
      MCP_GOOGLE_ADS_OFFICIAL_URL: http://mcp-google-ads-official:9006/mcp
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-research: { condition: service_started }
      mcp-ads: { condition: service_started }
      mcp-analytics: { condition: service_started }
      mcp-roi: { condition: service_started }
      mcp-compliance: { condition: service_started }
      mcp-public-data: { condition: service_started }
      mcp-linkedin: { condition: service_started }

  # Streamlit dashboard
  dashboard:
    build: .
    container_name: adforge-dashboard
    command: ["streamlit", "run", "adforge/dashboard/Overview.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: .env
    environment:
      ADFORGE_API_URL: http://api:8000
      ADFORGE_API_KEY: ${API_AUTH_TOKEN:-}
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
