[project]
name = "adforge"
version = "0.1.0"
description = "End-to-end multi-agent ad campaign platform — research → design → launch → measure → optimize → decide if it was worth it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AdForge Contributors" }]

dependencies = [
    # --- Agent orchestration ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-redis>=0.0.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",   # MCP <-> LangChain tool bridge
    "pyyaml>=6.0.1",                   # policy rules + MCP config

    # --- MCP (official SDK) ---
    "mcp>=1.0.0",
    "httpx>=0.27.0",

    # --- LLM providers ---
    "openai>=1.40.0",
    "anthropic>=0.34.0",

    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Storage ---
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",    # LangGraph Postgres checkpointer
    "alembic>=1.13.0",
    "redis>=5.0.0",

    # --- Tooling ---
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.0",
]

[project.optional-dependencies]
# Optional ad-platform SDKs. AdForge's KPI fetchers call the public HTTP APIs
# directly, so none of these are required to run the platform. Some (notably
# linkedin-api -> lxml) have no wheels for newer Python versions.
platforms = [
    "google-ads>=24.0.0",
    "google-auth-oauthlib>=1.2.0",
    "facebook-business>=21.0.0",
    "tavily-python>=0.5.0",
]

dashboard = [
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "fakeredis>=2.24.0",
    "curl_cffi>=0.7.0",
    "embedded-postgres>=18.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
adforge-api = "adforge.api.main:run"
adforge-dashboard = "adforge.dashboard.app:run"
adforge-mcp = "adforge.mcp_servers.runner:run"
adforge-seed = "adforge.storage.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that require DB / Redis / live APIs",
    "live: marks tests that call a real external service (LLM endpoint, ad APIs)",
]
timeout = 120

[tool.coverage.run]
source = ["adforge"]
branch = true
omit = [
    "adforge/dashboard/*",
    "adforge/llm/zai_glm.py",
    "adforge/llm/anthropic_provider.py",
    "adforge/llm/openai_provider.py",
    "adforge/mcp_servers/runner.py",
    "adforge/storage/alembic_env.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
