[project]
name = "adforge"
version = "0.1.0"
description = "End-to-end multi-agent ad campaign platform — research → design → launch → measure → optimize → decide if it was worth it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AdForge Contributors" }]

dependencies = [
    # --- Agent orchestration ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-redis>=0.0.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain[mcp]>=0.3.0",  # MCP ↔ LangGraph bridge (formerly langchain-mcp-adapters)

    # --- MCP (official SDK) ---
    "mcp>=1.0.0",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",

    # --- LLM providers ---
    "zai-sdk>=0.1.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",

    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Storage ---
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",

    # --- Ad platform SDKs ---
    # google-ads-python: used by our thin write wrapper (read path goes via googleads/google-ads-mcp)
    "google-ads>=24.0.0",
    "google-auth-oauthlib>=1.2.0",
    # facebook-business: used by our wrapper when self-hosting Meta (otherwise use Pipeboard remote MCP)
    "facebook-business>=21.0.0",
    # linkedin-api: community lib; we wrap as our own MCP (no official LinkedIn MCP exists)
    "linkedin-api>=2.0.0",

    # --- Dashboard ---
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",

    # --- Research agent tooling ---
    "tavily-python>=0.5.0",  # web search MCP backing the Research agent

    # --- Tooling ---
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.0",
    "pipx>=1.7.0",  # used to launch googleads/google-ads-mcp as a subprocess
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx[cli]>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
adforge-api = "adforge.api.main:run"
adforge-dashboard = "adforge.dashboard.app:run"
adforge-mcp = "adforge.mcp_servers.runner:run"
adforge-seed = "adforge.storage.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=adforge --cov-report=term-missing"
markers = [
    "integration: marks tests that require DB / Redis / live APIs",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
