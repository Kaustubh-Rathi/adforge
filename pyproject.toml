[project]
name = "adforge"
version = "0.1.0"
description = "End-to-end multi-agent ad campaign platform — research → design → launch → measure → optimize → decide if it was worth it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AdForge Contributors" }]

dependencies = [
    # --- Agent orchestration ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-redis>=0.0.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",   # MCP <-> LangChain tool bridge
    "pyyaml>=6.0.3",                   # policy rules + MCP config

    # --- MCP (official SDK) ---
    "mcp>=2.3.0",
    "httpx>=0.28.1",

    # --- LLM providers ---
    "openai>=3.57.0",
    "anthropic>=2.11.0",

    # --- API ---
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",

    # --- Storage ---
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    "psycopg[binary,pool]>=3.3.9",    # LangGraph Postgres checkpointer
    "alembic>=1.20.1",
    "redis>=8.1.0",

    # --- Tooling ---
    "tenacity>=9.2.1",
    "structlog>=26.1.0",
    "python-dotenv>=1.2.4",
    "click>=8.5.1",
]

[project.optional-dependencies]
# Optional ad-platform SDKs. AdForge's KPI fetchers call the public HTTP APIs
# directly, so none of these are required to run the platform. Some (notably
# linkedin-api -> lxml) have no wheels for newer Python versions.
platforms = [
    "google-ads>=35.1.0",
    "google-auth-oauthlib>=1.5.0",
    "facebook-business>=27.0.0",
    "tavily-python>=0.8.5",
]

dashboard = [
    "streamlit>=1.67.0",
    "plotly>=7.1.0",
    "pandas>=3.1.1",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "fakeredis>=2.24.0",
    "curl_cffi>=0.17.0",
    "embedded-postgres>=18.0.0",
    # Pinned to a minor series: ruff's formatter output changes between
    # releases, and a floating version turns CI into a formatting coin-flip.
    "ruff>=0.17.3,<0.18",
    "mypy>=1.11.0",
]

[project.scripts]
adforge-api = "adforge.api.main:run"
adforge-dashboard = "adforge.dashboard.run:run"
adforge-mcp = "adforge.mcp_servers.runner:run"
adforge-seed = "adforge.storage.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adforge"]

[tool.ruff.lint.per-file-ignores]
# Streamlit's legacy multipage nav labels the main page with its filename, so
# the entrypoint is Overview.py (capital O) on purpose. Renaming it to
# overview.py would ship a lowercase nav label.
"adforge/dashboard/Overview.py" = ["N999"]

# FastAPI's dependency-injection idiom *is* a call in a default argument:
# ``tenant_id: str = Depends(get_tenant)``. B008 is a false positive here and
# the framework relies on the pattern, so it is scoped to route modules only —
# everywhere else a call in a default stays an error.
"adforge/api/routes/*.py" = ["B008"]
"adforge/api/deps.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that require DB / Redis / live APIs",
    "live: marks tests that call a real external service (LLM endpoint, ad APIs)",
]
timeout = 120

[tool.coverage.run]
source = ["adforge"]
branch = true
omit = [
    "adforge/dashboard/*",
    "adforge/llm/zai_glm.py",
    "adforge/llm/anthropic_provider.py",
    "adforge/llm/openai_provider.py",
    "adforge/mcp_servers/runner.py",
    "adforge/storage/alembic_env.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
