# AdForge dashboard theme — quiet operations-console look.
# The full design system lives in adforge/dashboard/theme.py; these values
# only cover Streamlit's native chrome so it matches the injected CSS.
[theme]
primaryColor = "#176B4F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#12181F"

[browser]
gatherUsageStats = false
